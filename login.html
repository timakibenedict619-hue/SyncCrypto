<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0F172A">  <title>Sign In | SyncCrypto</title>  <script src="https://cdn.tailwindcss.com"></script>  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">  <style>
    :root {
      --primary: #FFD700;
      --primary-dark: #E6C200;
      --primary-light: #FFED4E;
      --dark: #0F172A;
    }

    * {
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--dark);
      background-image:
        radial-gradient(circle at 20% 50%, rgba(255, 215, 0, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(255, 215, 0, 0.08) 0%, transparent 50%);
    }

    .glass {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 215, 0, 0.1);
    }

    .input-focus:focus {
      box-shadow: 0 0 0 3px rgba(255, 215, 0, 0.2);
      border-color: var(--primary);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 215, 0, 0.4);
    }

    .btn-primary:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(15, 23, 42, 0.3);
      border-top-color: var(--dark);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .password-toggle:hover {
      color: var(--primary);
    }

    .toast-enter {
      animation: slideIn 0.3s ease-out forwards;
    }

    @keyframes slideIn {
      from {
        transform: translate(-50%, -15px);
        opacity: 0;
      }
      to {
        transform: translate(-50%, 0);
        opacity: 1;
      }
    }

    .hidden {
      display: none !important;
    }

    button:focus-visible,
    a:focus-visible,
    input:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 3px;
    }
  </style></head><body class="text-slate-200 flex items-center justify-center p-4">  <!-- Notification -->  <div
    id="toast"
    role="status"
    aria-live="polite"
    class="fixed top-4 left-1/2 -translate-x-1/2 z-50 hidden max-w-md w-[calc(100%-2rem)]"
  >
    <div id="toastContent" class="glass rounded-lg px-4 py-3 shadow-xl flex items-start gap-3">
      <i id="toastIcon" class="mt-0.5"></i>  <p id="toastMessage" class="text-sm flex-1"></p>

  <button
    id="toastClose"
    type="button"
    aria-label="Close notification"
    class="text-slate-400 hover:text-white"
  >
    <i class="fa-solid fa-xmark"></i>
  </button>
</div>

  </div>  <main class="w-full max-w-md"><!-- Logo -->
<div class="text-center mb-8">
  <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-[#FFD700] to-[#E6C200] mb-4 shadow-lg shadow-[#FFD700]/20">
    <i class="fa-solid fa-coins text-3xl text-slate-900"></i>
  </div>

  <h1 class="text-3xl font-bold text-white mb-2">
    Welcome to <span class="text-[#FFD700]">SyncCrypto</span>
  </h1>

  <p class="text-slate-400 text-sm">
    Sign in to access your crypto dashboard
  </p>
</div>

<!-- Login Card -->
<section class="glass rounded-2xl p-6 sm:p-8 shadow-2xl">

  <form id="loginForm" novalidate>

    <!-- Email -->
    <div class="mb-5">
      <label for="email" class="block text-sm font-medium text-slate-300 mb-2">
        Email Address
      </label>

      <div class="relative">
        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
          <i class="fa-regular fa-envelope text-slate-500"></i>
        </div>

        <input
          type="email"
          id="email"
          name="email"
          required
          autocomplete="email"
          inputmode="email"
          autocapitalize="none"
          spellcheck="false"
          class="input-focus w-full bg-slate-800/50 border border-slate-700 rounded-lg pl-10 pr-4 py-3 text-white placeholder-slate-500 focus:outline-none transition-all"
          placeholder="you@example.com"
        >
      </div>

      <p id="emailError" class="mt-1 text-xs text-red-400 hidden"></p>
    </div>

    <!-- Password -->
    <div class="mb-5">
      <label for="password" class="block text-sm font-medium text-slate-300 mb-2">
        Password
      </label>

      <div class="relative">
        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
          <i class="fa-solid fa-lock text-slate-500"></i>
        </div>

        <input
          type="password"
          id="password"
          name="password"
          required
          autocomplete="current-password"
          class="input-focus w-full bg-slate-800/50 border border-slate-700 rounded-lg pl-10 pr-12 py-3 text-white placeholder-slate-500 focus:outline-none transition-all"
          placeholder="Enter your password"
        >

        <button
          type="button"
          id="togglePassword"
          aria-label="Show password"
          aria-pressed="false"
          class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-500 password-toggle transition-colors"
        >
          <i id="toggleIcon" class="fa-regular fa-eye"></i>
        </button>
      </div>

      <p id="passwordError" class="mt-1 text-xs text-red-400 hidden"></p>
    </div>

    <!-- Remember Me & Forgot Password -->
    <div class="flex items-center justify-between mb-6 flex-wrap gap-3">

      <label class="flex items-center cursor-pointer group">
        <input
          type="checkbox"
          id="rememberMe"
          class="w-4 h-4 rounded border-slate-600 bg-slate-800 text-[#FFD700] focus:ring-[#FFD700] focus:ring-offset-0 focus:ring-2 cursor-pointer"
        >

        <span class="ml-2 text-sm text-slate-300 group-hover:text-white transition-colors">
          Remember me
        </span>
      </label>

      <button
        type="button"
        id="forgotPasswordBtn"
        class="text-sm text-[#FFD700] hover:text-[#FFED4E] font-medium transition-colors"
      >
        Forgot Password?
      </button>

    </div>

    <!-- Sign In -->
    <button
      type="submit"
      id="signInBtn"
      class="btn-primary w-full text-slate-900 font-semibold py-3 rounded-lg flex items-center justify-center gap-2"
    >
      <span id="btnText">Sign In</span>
      <span id="btnSpinner" class="spinner hidden" aria-hidden="true"></span>
    </button>

  </form>

  <!-- Divider -->
  <div class="relative my-6">
    <div class="absolute inset-0 flex items-center">
      <div class="w-full border-t border-slate-700"></div>
    </div>

    <div class="relative flex justify-center text-xs">
      <span class="px-3 bg-slate-800 text-slate-400">
        New to SyncCrypto?
      </span>
    </div>
  </div>

  <!-- Register -->
  <a
    href="register.html"
    class="block w-full text-center py-3 rounded-lg border border-slate-700 text-slate-300 hover:bg-slate-800/50 hover:border-[#FFD700]/30 hover:text-white font-medium transition-all"
  >
    Create an Account
  </a>

</section>

<!-- Footer -->
<p class="text-center text-xs text-slate-500 mt-6">
  By signing in, you agree to our
  <a href="terms.html" class="text-slate-400 hover:text-[#FFD700]">Terms of Service</a>
  and
  <a href="privacy.html" class="text-slate-400 hover:text-[#FFD700]">Privacy Policy</a>.
</p>

  </main>  <!-- Firebase Authentication -->  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      sendPasswordResetEmail,
      setPersistence,
      browserLocalPersistence,
      browserSessionPersistence
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    /*
      IMPORTANT:
      This configuration must match the Firebase project
      used by your SyncCrypto registration page and dashboard.
    */
    const firebaseConfig = {
      apiKey: "AIzaSyAVYYdxtOnixpdGJOWqVKrFczTQrWV8jLo",
      authDomain: "synccrypto-fa0ac.firebaseapp.com",
      projectId: "synccrypto-fa0ac",
      storageBucket: "synccrypto-fa0ac.firebasestorage.app",
      messagingSenderId: "609980963372",
      appId: "1:609980963372:web:f0f3addb7cdcb555230f89",
      measurementId: "G-R3R5153SDR"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Elements
    const loginForm = document.getElementById("loginForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");

    const signInBtn = document.getElementById("signInBtn");
    const btnText = document.getElementById("btnText");
    const btnSpinner = document.getElementById("btnSpinner");

    const forgotPasswordBtn = document.getElementById("forgotPasswordBtn");
    const togglePassword = document.getElementById("togglePassword");
    const toggleIcon = document.getElementById("toggleIcon");
    const rememberMe = document.getElementById("rememberMe");

    const toast = document.getElementById("toast");
    const toastIcon = document.getElementById("toastIcon");
    const toastMessage = document.getElementById("toastMessage");
    const toastClose = document.getElementById("toastClose");

    const emailError = document.getElementById("emailError");
    const passwordError = document.getElementById("passwordError");

    let toastTimer;

    // Notifications
    function showToast(message, type = "error") {
      clearTimeout(toastTimer);

      toastMessage.textContent = message;

      toastIcon.className = type === "success"
        ? "fa-solid fa-circle-check mt-0.5 text-green-400"
        : type === "info"
          ? "fa-solid fa-circle-info mt-0.5 text-[#FFD700]"
          : "fa-solid fa-circle-exclamation mt-0.5 text-red-400";

      toast.classList.remove("hidden");
      toast.classList.add("toast-enter");

      toastTimer = setTimeout(() => {
        toast.classList.add("hidden");
        toast.classList.remove("toast-enter");
      }, 5000);
    }

    toastClose.addEventListener("click", () => {
      clearTimeout(toastTimer);
      toast.classList.add("hidden");
      toast.classList.remove("toast-enter");
    });

    // Field errors
    function clearFieldErrors() {
      emailError.textContent = "";
      passwordError.textContent = "";

      emailError.classList.add("hidden");
      passwordError.classList.add("hidden");

      emailInput.removeAttribute("aria-invalid");
      passwordInput.removeAttribute("aria-invalid");
    }

    function setFieldError(input, errorElement, message) {
      errorElement.textContent = message;
      errorElement.classList.remove("hidden");
      input.setAttribute("aria-invalid", "true");
      input.focus();
    }

    // Button loading state
    function setLoading(isLoading, mode = "login") {
      signInBtn.disabled = isLoading;
      forgotPasswordBtn.disabled = isLoading;

      signInBtn.setAttribute("aria-busy", String(isLoading));

      if (isLoading) {
        btnText.textContent = mode === "reset"
          ? "Sending reset email..."
          : "Signing in...";

        btnSpinner.classList.remove("hidden");
      } else {
        btnText.textContent = "Sign In";
        btnSpinner.classList.add("hidden");
      }
    }

    // Password visibility
    togglePassword.addEventListener("click", () => {
      const showing = passwordInput.type === "password";

      passwordInput.type = showing ? "text" : "password";

      toggleIcon.className = showing
        ? "fa-regular fa-eye-slash"
        : "fa-regular fa-eye";

      togglePassword.setAttribute("aria-pressed", String(showing));
      togglePassword.setAttribute(
        "aria-label",
        showing ? "Hide password" : "Show password"
      );
    });

    // Email validation
    function isValidEmail(value) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
    }

    // Friendly Firebase errors
    function getAuthErrorMessage(error) {
      switch (error.code) {
        case "auth/invalid-email":
          return "Please enter a valid email address.";

        case "auth/invalid-credential":
        case "auth/wrong-password":
        case "auth/user-not-found":
          return "Incorrect email or password.";

        case "auth/user-disabled":
          return "This account has been disabled. Please contact support.";

        case "auth/too-many-requests":
          return "Too many attempts. Please wait a while and try again.";

        case "auth/network-request-failed":
          return "Network error. Check your internet connection and try again.";

        case "auth/email-not-verified":
          return "Please verify your email address before signing in.";

        case "auth/operation-not-allowed":
          return "Email and password sign-in is not enabled in Firebase.";

        case "auth/weak-password":
          return "The password does not meet the required security level.";

        case "auth/invalid-action-code":
        case "auth/expired-action-code":
          return "This password reset link is invalid or has expired.";

        default:
          return "Unable to complete your request. Please try again.";
      }
    }

    // Sign in
    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      clearFieldErrors();

      const userEmail = emailInput.value.trim();
      const userPassword = passwordInput.value;

      if (!userEmail) {
        setFieldError(emailInput, emailError, "Please enter your email address.");
        return;
      }

      if (!isValidEmail(userEmail)) {
        setFieldError(emailInput, emailError, "Please enter a valid email address.");
        return;
      }

      if (!userPassword) {
        setFieldError(passwordInput, passwordError, "Please enter your password.");
        return;
      }

      setLoading(true, "login");

      try {
        // Apply the user's requested sign-in persistence.
        await setPersistence(
          auth,
          rememberMe.checked
            ? browserLocalPersistence
            : browserSessionPersistence
        );

        const credential = await signInWithEmailAndPassword(
          auth,
          userEmail,
          userPassword
        );

        const user = credential.user;

        // Require email verification if this is your app's policy.
        if (!user.emailVerified) {
          /*
            Firebase has already signed the user in.
            Sign them out before showing the verification message.
          */
          const { signOut } = await import(
            "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js"
          );

          await signOut(auth);

          showToast("Please verify your email address before signing in.");
          return;
        }

        showToast("Sign-in successful. Redirecting...", "success");

        // Change this if your dashboard uses a different path.
        window.location.replace("dashboard.html");

      } catch (error) {
        console.error("Sign-in error:", error);

        showToast(getAuthErrorMessage(error));

      } finally {
        setLoading(false);
      }
    });

    // Forgot password
    forgotPasswordBtn.addEventListener("click", async () => {
      clearFieldErrors();

      const userEmail = emailInput.value.trim();

      if (!userEmail) {
        setFieldError(
          emailInput,
          emailError,
          "Enter your email address first."
        );
        return;
      }

      if (!isValidEmail(userEmail)) {
        setFieldError(
          emailInput,
          emailError,
          "Please enter a valid email address."
        );
        return;
      }

      setLoading(true, "reset");

      try {
        await sendPasswordResetEmail(auth, userEmail);

        /*
          Use a generic success message to avoid revealing
          whether an email address has an account.
        */
        showToast(
          "If an account exists for that email, a password reset email will be sent.",
          "success"
        );

      } catch (error) {
        console.error("Password reset error:", error);
        showToast(getAuthErrorMessage(error));

      } finally {
        setLoading(false);
      }
    });

    // Restore remembered email only when Remember Me was selected.
    try {
      const savedEmail = localStorage.getItem("syncCryptoRememberedEmail");

      if (savedEmail) {
        emailInput.value = savedEmail;
        rememberMe.checked = true;
      }
    } catch (error) {
      console.warn("Could not read saved login preference.", error);
    }

    // Store or remove the email when the checkbox changes.
    rememberMe.addEventListener("change", () => {
      try {
        if (rememberMe.checked) {
          localStorage.setItem(
            "syncCryptoRememberedEmail",
            emailInput.value.trim()
          );
        } else {
          localStorage.removeItem("syncCryptoRememberedEmail");
        }
      } catch (error) {
        console.warn("Could not save login preference.", error);
      }
    });

    emailInput.addEventListener("input", () => {
      if (rememberMe.checked) {
        try {
          localStorage.setItem(
            "syncCryptoRememberedEmail",
            emailInput.value.trim()
          );
        } catch (error) {
          console.warn("Could not update saved email.", error);
        }
      }
    });
  </script></body>
  </html>
