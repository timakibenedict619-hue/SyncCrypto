<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Withdraw Funds | SyncCrypto</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --gold: #f6ca4a;
      --dark: #080b12;
      --card: rgba(19, 25, 38, 0.88);
      --border: rgba(255, 255, 255, 0.1);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: #f8fafc;
      font-family: "DM Sans", sans-serif;
      background:
        radial-gradient(circle at 10% 5%, rgba(246, 202, 74, 0.16), transparent 28rem),
        radial-gradient(circle at 95% 90%, rgba(59, 130, 246, 0.16), transparent 30rem),
        var(--dark);
    }

    h1, h2, h3 {
      font-family: "Space Grotesk", sans-serif;
    }

    input,
    select {
      width: 100%;
      color: #f8fafc;
      background: rgba(7, 12, 21, 0.74);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 13px;
      outline: none;
      padding: 0.9rem 1rem;
      transition: 0.2s ease;
    }

    input::placeholder {
      color: #718096;
    }

    input:focus,
    select:focus {
      border-color: rgba(246, 202, 74, 0.85);
      box-shadow: 0 0 0 4px rgba(246, 202, 74, 0.1);
    }

    select option {
      background: #141b29;
      color: white;
    }

    .method-form {
      display: none;
    }

    .method-form.active {
      display: block;
      animation: appear 0.25s ease;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .input-icon {
      position: relative;
    }

    .input-icon svg {
      position: absolute;
      left: 1rem;
      top: 50%;
      width: 18px;
      height: 18px;
      color: #93a1b7;
      transform: translateY(-50%);
      pointer-events: none;
    }

    .input-icon input {
      padding-left: 3rem;
    }
  </style>
</head>

<body class="min-h-screen px-4 py-8 sm:flex sm:items-center sm:justify-center">
  <main class="w-full max-w-xl overflow-hidden rounded-3xl border border-white/10 bg-[rgba(19,25,38,0.88)] shadow-2xl shadow-black/40 backdrop-blur-xl">

    <header class="flex items-center justify-between border-b border-white/10 px-6 py-5">
      <div class="flex items-center gap-3">
        <div class="grid h-11 w-11 place-items-center rounded-xl bg-yellow-400/10 text-yellow-400">
          <i data-lucide="arrow-up-right" class="h-5 w-5"></i>
        </div>

        <div>
          <p class="text-xs font-semibold uppercase tracking-[0.16em] text-yellow-400">Wallet withdrawal</p>
          <h1 class="text-xl font-bold text-white">Withdraw funds</h1>
        </div>
      </div>

      <button
        onclick="window.location.href='dashboard.html'"
        aria-label="Close withdrawal page"
        class="rounded-xl p-2 text-slate-400 transition hover:bg-white/5 hover:text-white">
        <i data-lucide="x" class="h-5 w-5"></i>
      </button>
    </header>

    <section class="p-5 sm:p-6">
      <div class="mb-6 rounded-2xl border border-yellow-400/15 bg-yellow-400/[0.06] p-4">
        <div class="flex gap-3">
          <i data-lucide="clock-3" class="mt-0.5 h-5 w-5 shrink-0 text-yellow-400"></i>
          <div>
            <p class="font-semibold text-white">Withdrawal review required</p>
            <p class="mt-1 text-sm leading-5 text-slate-400">
              Withdrawal requests are marked as pending while they await processing.
            </p>
          </div>
        </div>
      </div>

      <form id="withdrawalForm" class="space-y-5">
        <div>
          <label for="amount" class="mb-2 block text-sm font-semibold text-slate-300">
            Withdrawal amount
          </label>

          <div class="input-icon">
            <i data-lucide="circle-dollar-sign"></i>
            <input
              id="amount"
              type="number"
              min="0"
              step="any"
              placeholder="Enter amount in USD"
              required>
          </div>
        </div>

        <div>
          <label for="walletSelect" class="mb-2 block text-sm font-semibold text-slate-300">
            Withdraw from
          </label>

          <select id="walletSelect">
            <option value="funding">Funding — Loading balance...</option>
          </select>
        </div>

        <div>
          <label for="method" class="mb-2 block text-sm font-semibold text-slate-300">
            Withdrawal method
          </label>

          <select id="method" required>
            <option value="" selected disabled>Select payment method</option>
            <option value="bitcoin">Bitcoin</option>
            <option value="bank">Bank account</option>
          </select>
        </div>

        <!-- BITCOIN FORM -->
        <div id="bitcoinForm" class="method-form rounded-2xl border border-orange-400/15 bg-orange-400/[0.04] p-4">
          <div class="mb-4 flex items-center gap-3">
            <div class="grid h-9 w-9 place-items-center rounded-lg bg-orange-400/10 text-orange-400">
              <i data-lucide="bitcoin" class="h-5 w-5"></i>
            </div>

            <div>
              <h2 class="font-bold text-white">Bitcoin details</h2>
              <p class="text-xs text-slate-400">Enter the Bitcoin address receiving this withdrawal.</p>
            </div>
          </div>

          <label for="bitcoinAddress" class="mb-2 block text-sm font-semibold text-slate-300">
            Bitcoin wallet address
          </label>

          <div class="input-icon">
            <i data-lucide="wallet"></i>
            <input
              id="bitcoinAddress"
              type="text"
              placeholder="Enter your Bitcoin address"
              autocomplete="off">
          </div>
        </div>

        <!-- BANK FORM -->
        <div id="bankForm" class="method-form rounded-2xl border border-blue-400/15 bg-blue-400/[0.04] p-4">
          <div class="mb-4 flex items-center gap-3">
            <div class="grid h-9 w-9 place-items-center rounded-lg bg-blue-400/10 text-blue-400">
              <i data-lucide="landmark" class="h-5 w-5"></i>
            </div>

            <div>
              <h2 class="font-bold text-white">Bank account details</h2>
              <p class="text-xs text-slate-400">Ensure these account details are accurate.</p>
            </div>
          </div>

          <div class="space-y-4">
            <div>
              <label for="accountName" class="mb-2 block text-sm font-semibold text-slate-300">
                Account holder name
              </label>
              <input
                id="accountName"
                type="text"
                placeholder="Full name on the account"
                autocomplete="name">
            </div>

            <div>
              <label for="bankName" class="mb-2 block text-sm font-semibold text-slate-300">
                Bank name
              </label>
              <input
                id="bankName"
                type="text"
                placeholder="Enter bank name">
            </div>

            <div>
              <label for="accountNumber" class="mb-2 block text-sm font-semibold text-slate-300">
                Account number
              </label>
              <input
                id="accountNumber"
                type="text"
                inputmode="numeric"
                placeholder="Enter account number">
            </div>
          </div>
        </div>

        <button
          id="withdrawBtn"
          type="submit"
          class="flex w-full items-center justify-center gap-2 rounded-xl bg-gradient-to-r from-yellow-300 to-amber-500 px-5 py-4 font-bold text-[#171209] shadow-lg shadow-yellow-400/10 transition hover:-translate-y-0.5 hover:brightness-105">
          <i data-lucide="send" class="h-5 w-5"></i>
          Submit withdrawal request
        </button>

        <button
          type="button"
          onclick="window.location.href='dashboard.html'"
          class="w-full rounded-xl py-3 text-sm font-semibold text-slate-400 transition hover:bg-white/5 hover:text-white">
          Cancel
        </button>
      </form>
    </section>
  </main>

  <script>
    lucide.createIcons();
  </script>

  <script type="module" src="withdrawal.js"></script>
</body>
</html>
